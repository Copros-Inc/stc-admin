<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC 管理画面 | ブログ投稿管理</title>
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- ★共通パーツの読み込み（相対パスに注意してください） -->
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>

    <style>
        /* このページ専用の微調整 */
        input, textarea, select { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            padding: 15px; 
            width: 100%; 
            color: white; 
            outline: none; 
            margin-top: 10px; 
            transition: 0.3s; 
        }
        input:focus, textarea:focus { border-color: #00a2ff; background: rgba(0, 162, 255, 0.05); }
        .image-drop-zone { 
            width: 100%; 
            height: 250px; 
            background: rgba(0,0,0,0.2); 
            border: 2px dashed rgba(255,255,255,0.1); 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            cursor: pointer;
            transition: 0.3s;
        }
        .image-drop-zone:hover { border-color: #00a2ff; background: rgba(0, 162, 255, 0.05); }
    </style>
</head>
<body>
    <!-- サイドバーは common.js が自動で挿入します -->

    <div class="main-content">
        <!-- 共通スタイルの水色タイトル -->
        <h1 class="admin-page-title">Blog Post</h1>
        <p class="admin-page-subtitle">現場の熱量をHPへ即時アップロード</p>

        <div class="admin-card text-left">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-8">
                <!-- 左側：入力エリア -->
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] font-black text-sky-400 uppercase tracking-widest italic">Category</label>
                        <select id="blog-category">
                            <option value="資格・講習ガイド">資格・講習ガイド</option>
                            <option value="法改正・業界ニュース">法改正・業界ニュース</option>
                            <option value="現場レポート">現場レポート</option>
                            <option value="重要なお知らせ">重要なお知らせ</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-sky-400 uppercase tracking-widest italic">Title</label>
                        <input type="text" id="blog-title" placeholder="記事のタイトルを入力...">
                    <div>
                        <label class="text-[10px] font-black text-sky-400 uppercase tracking-widest italic">Post Date</label>
                        <input type="date" id="blog-date" style="color-scheme: dark;">
                    </div>
                    </div>
                </div>

                <!-- 右側：画像アップロード -->
                <div>
                    <label class="text-[10px] font-black text-sky-400 uppercase tracking-widest italic">Cover Image</label>
                    <div class="image-drop-zone mt-2" onclick="document.getElementById('blog-image').click()">
                        <div id="placeholder-text" class="text-center">
                            <i class="fas fa-camera text-4xl text-slate-700 mb-3"></i>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Upload Photo</p>
                        </div>
                        <img id="img-preview" class="w-full h-full object-cover hidden">
                    </div>
                    <input type="file" id="blog-image" accept="image/*" class="hidden" onchange="previewImage(this)">
                </div>
            </div>

            <!-- 本文エリア -->
            <div class="mb-10">
                <label class="text-[10px] font-black text-sky-400 uppercase tracking-widest italic">Content</label>
                <textarea id="blog-content" rows="12" placeholder="ここに本文を入力してください。改行は自動で反映されます。"></textarea>
            </div>

                       <!-- 送信ボタン ＆ 確認ボタン -->
            <div class="flex gap-4 mb-10">
                <button onclick="uploadBlog()" id="submit-btn" class="flex-1 bg-[#00a2ff] hover:bg-white hover:text-[#001a33] text-white py-5 rounded-2xl font-[900] text-xl italic uppercase tracking-widest transition-all shadow-lg flex items-center justify-center gap-4">
                    <i class="fas fa-paper-plane"></i> <span id="btn-text">記事を公開する</span>
                </button>
                
                <!-- HP確認ボタン（別タブで開く） -->
                <a href="blog.html" target="_blank" class="bg-white/10 hover:bg-white/20 text-white px-8 py-5 rounded-2xl font-black italic border border-white/20 flex items-center justify-center" title="HPを確認">
                    <i class="fas fa-external-link-alt text-xl"></i>
                </a>
            </div>
            
        </div>
             <!-- 一覧表示エリア -->
            <div class="mt-20">
                <label class="text-[10px] font-black text-sky-400 uppercase tracking-widest italic">Current Posts</label>
                <div id="admin-blog-list" class="grid grid-cols-1 gap-4 mt-4">
                    <p class="text-slate-500 italic">読み込み中...</p>
                </div>
            </div>     
    </div>

        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw",
            authDomain: "stc-hp.firebaseapp.com",
            projectId: "stc-hp",
            storageBucket: "stc-hp.firebasestorage.app",
            messagingSenderId: "795332931918",
            appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let imageData = "";
        let editingId = null; // 編集中のID

        // 今日をセット
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('blog-date').value = new Date().toISOString().split('T')[0];
            loadAdminBlogList();
        });

        // 画像プレビュー
        window.previewImage = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 1200; 
                        const scale = MAX / img.width;
                        canvas.width = MAX; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, MAX, canvas.height);
                        imageData = canvas.toDataURL('image/jpeg', 0.8);
                        document.getElementById('img-preview').src = imageData;
                        document.getElementById('img-preview').classList.remove('hidden');
                        document.getElementById('placeholder-text').classList.add('hidden');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        // 編集モード
        window.editBlog = (id, title, content, category, image, date) => {
            editingId = id;
            document.getElementById('blog-title').value = title;
            document.getElementById('blog-content').value = content;
            document.getElementById('blog-category').value = category;
            document.getElementById('blog-date').value = date;
            
            if (image) {
                imageData = image;
                document.getElementById('img-preview').src = image;
                document.getElementById('img-preview').classList.remove('hidden');
                document.getElementById('placeholder-text').classList.add('hidden');
            } else {
                document.getElementById('img-preview').classList.add('hidden');
                document.getElementById('placeholder-text').classList.remove('hidden');
                imageData = "";
            }
            
            document.getElementById('btn-text').innerText = "内容を更新する";
            document.getElementById('submit-btn').classList.replace('bg-[#00a2ff]', 'bg-emerald-500');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 公開・更新処理
        window.uploadBlog = async () => {
            const title = document.getElementById('blog-title').value;
            const content = document.getElementById('blog-content').value;
            const category = document.getElementById('blog-category').value;
            const postDate = document.getElementById('blog-date').value;
            const btn = document.getElementById('submit-btn');

            if (!title || !content) { alert("タイトルと本文を入力してください！"); return; }
            btn.disabled = true;

            try {
                if (!auth.currentUser) await signInAnonymously(auth);
                const blogData = {
                    title: title, content: content, category: category, image: imageData,
                    summary: content.substring(0, 100),
                    createdAt: postDate ? new Date(postDate) : new Date()
                };

                if (editingId) {
                    await updateDoc(doc(db, "blogs", editingId), blogData);
                    alert("更新完了！");
                } else {
                    await addDoc(collection(db, "blogs"), blogData);
                    alert("公開完了！");
                }

                // リセット
                editingId = null;
                document.getElementById('blog-title').value = "";
                document.getElementById('blog-content').value = "";
                document.getElementById('img-preview').classList.add('hidden');
                document.getElementById('placeholder-text').classList.remove('hidden');
                imageData = "";
                document.getElementById('btn-text').innerText = "記事を公開する";
                document.getElementById('submit-btn').classList.replace('bg-emerald-500', 'bg-[#00a2ff]');
                btn.disabled = false;
            } catch (e) { alert("エラーが発生しました。"); btn.disabled = false; }
        };

        // 一覧表示
        function loadAdminBlogList() {
            const listEl = document.getElementById('admin-blog-list');
            const q = query(collection(db, "blogs"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                listEl.innerHTML = snapshot.docs.map(blogDoc => {
                    const d = blogDoc.data();
                    const date = d.createdAt?.toDate().toISOString().split('T')[0] || '';
                    return `
                        <div class="flex items-center justify-between bg-black/30 p-4 rounded-2xl border border-white/5 mb-3">
                            <div class="flex items-center gap-4 text-left">
                                ${d.image ? `<img src="${d.image}" class="w-10 h-10 object-cover rounded">` : `<div class="w-10 h-10 bg-slate-800 rounded"></div>`}
                                <div class="text-white text-xs font-bold">${d.title}</div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editBlog('${blogDoc.id}', \`${d.title}\`, \`${d.content}\`, '${d.category}', '${d.image || ''}', '${date}')" class="text-sky-400 p-2"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteBlog('${blogDoc.id}')" class="text-slate-500 p-2"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>`;
                }).join('');
            });
        }

        window.deleteBlog = async (id) => {
            if (confirm("削除しますか？")) await deleteDoc(doc(db, "blogs", id));
        };
    </script>
</body>
</html>
