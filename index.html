<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Dashboard | STC 管理画面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>
    <style>
        .stat-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 25px; transition: 0.3s; height: 100%; }
        .stat-number { font-family: 'Montserrat'; font-size: 1.8rem; font-weight: 900; color: #fff; font-style: italic; }
        .stat-label { font-size: 0.6rem; font-weight: 900; color: #64748b; text-transform: uppercase; tracking: 0.1em; margin-bottom: 8px; display: block; }
        .chart-container { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.1); border-radius: 30px; padding: 30px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #0f172a; border: 2px solid #00a2ff; border-radius: 2.5rem; padding: 40px; width: 95%; max-width: 1100px; max-height: 85vh; overflow-y: auto; }
        .past-input-grid input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 5px; width: 100%; border-radius: 5px; text-align: center; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="admin-page-title">Management Analysis</h1>
                <p class="admin-page-subtitle">24時間受付実績と年度目標達成率の可視化</p>
            </div>
            <div class="flex gap-3">
                <button onclick="window.openPastDataModal()" class="bg-white/5 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 px-5 py-2 rounded-xl font-black italic text-xs transition flex items-center gap-2">
                    <i class="fas fa-database"></i> 過去・計画データの編集
                </button>
                <select id="fiscal-year-select" class="bg-slate-900 border border-white/10 rounded-xl px-4 py-2 font-bold text-sky-400 outline-none focus:border-sky-500 transition-all">
                    <option value="2027">2027年度 (R9)</option>
                    <option value="2026">2026年度 (R8)</option>
                    <option value="2025">2025年度 (R7)</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-10">
            <div class="stat-card border-l-4 border-sky-500">
                <span class="stat-label">受講者数</span>
                <div class="stat-number" id="card-users">0 <span class="text-xs opacity-40">名</span></div>
            </div>
            <div class="stat-card border-l-4 border-rose-500">
                <span class="stat-label">現在空席数</span>
                <div class="stat-number text-rose-400" id="card-empty">0 <span class="text-xs opacity-40">席</span></div>
            </div>
            <div class="stat-card border-l-4 border-emerald-500">
                <span class="stat-label">目標達成率</span>
                <div class="stat-number text-emerald-400" id="card-target">0 <span class="text-xs opacity-40">%</span></div>
            </div>
            <div class="stat-card border-l-4 border-purple-500">
                <span class="stat-label">前年比(成長率)</span>
                <div class="stat-number text-purple-400" id="card-growth">0 <span class="text-xs opacity-40">%</span></div>
            </div>
            <div class="stat-card border-l-4 border-amber-500">
                <span class="stat-label">時間外受付件数</span>
                <div class="stat-number text-amber-400" id="card-afterhours">0 <span class="text-xs opacity-40">件</span></div>
            </div>
            <div class="stat-card border-l-4 border-indigo-500">
                <span class="stat-label">売上合計</span>
                <div class="stat-number text-indigo-400" id="card-sales">¥0 <span class="text-xs opacity-40">-</span></div>
            </div>
        </div>

        <div class="bg-white/5 border border-white/5 p-6 rounded-[2rem] mb-10 flex flex-wrap items-center justify-center gap-8">
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-black text-slate-500 uppercase italic tracking-widest">Target Month</span>
                <select id="target-month-select" class="bg-slate-900 border border-white/10 rounded-xl px-6 py-2 font-black text-sky-400 outline-none focus:border-sky-500 transition-all">
                    <option value="all">年度通期累計 (4月-3月)</option>
                    <option value="0">4月</option><option value="1">5月</option><option value="2">6月</option><option value="3">7月</option>
                    <option value="4">8月</option><option value="5">9月</option><option value="6">10月</option><option value="7">11月</option>
                    <option value="8">12月</option><option value="9">1月</option><option value="10">2月</option><option value="11">3月</option>
                </select>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest italic">Course Filter</span>
                <select id="course-filter" class="bg-slate-900 border border-white/10 rounded-xl px-6 py-2 font-black text-sky-400 outline-none focus:border-sky-500 transition-all">
                    <option value="all">すべての講習を表示</option>
                    <option value="玉掛け">玉掛け技能講習</option>
                    <option value="クレーン">小型移動式クレーン</option>
                    <option value="フォーク">フォークリフト運転</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 mb-10">
            <div class="lg:col-span-3 chart-container">
                <h3 class="font-[900] italic text-sky-400 uppercase tracking-tighter mb-8">Course performance trends</h3>
                <div style="height: 400px;"><canvas id="mainChart"></canvas></div>
            </div>
            <div class="lg:col-span-1 stat-card">
                <h3 class="stat-label mb-8 text-center text-sky-400">Course Share</h3>
                <div class="aspect-square"><canvas id="shareChart"></canvas></div>
            </div>
        </div>
    </div>

    <div id="past-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                <h2 class="text-2xl font-black italic text-sky-400">Master Data Management</h2>
                <button onclick="window.closePastDataModal()" class="text-slate-500 hover:text-white text-3xl">&times;</button>
            </div>
            <div class="flex gap-2 mb-6">
                <button onclick="window.switchModalYear(2025)" id="tab-2025" class="px-6 py-2 rounded-t-xl font-black italic text-xs bg-sky-600 text-white">2025年度</button>
                <button onclick="window.switchModalYear(2026)" id="tab-2026" class="px-6 py-2 rounded-t-xl font-black italic text-xs bg-white/5 text-slate-400">2026年度</button>
                <button onclick="window.switchModalYear(2027)" id="tab-2027" class="px-6 py-2 rounded-t-xl font-black italic text-xs bg-white/5 text-slate-400">2027年度</button>
                <button onclick="window.switchModalYear(2028)" id="tab-2028" class="px-6 py-2 rounded-t-xl font-black italic text-xs bg-white/5 text-slate-400">2028年度</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full border-collapse text-[10px]">
<thead>
    <tr class="text-slate-500 border-b border-white/10 text-left italic">
        <th class="p-2">対象月</th>
        <th class="p-2 text-sky-400">玉掛 (回)</th><th class="p-2 text-sky-400">玉掛 (実績人数)</th>
        <th class="p-2 text-emerald-400">クレーン (回)</th><th class="p-2 text-emerald-400">クレーン (実績)</th>
        <th class="p-2 text-amber-400">フォーク (回)</th><th class="p-2 text-amber-400">フォーク (実績)</th>
    </tr>
</thead>
                    <tbody id="modal-table-body" class="past-input-grid"></tbody>
                </table>
            </div>
            <button onclick="window.savePastData()" class="w-full mt-10 bg-sky-600 hover:bg-sky-500 text-white py-5 rounded-2xl font-black italic transition">全てのデータを保存して更新</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        const firebaseConfig = { apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw", authDomain: "stc-hp.firebaseapp.com", projectId: "stc-hp", storageBucket: "stc-hp.firebasestorage.app", messagingSenderId: "795332931918", appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let mainChart, shareChart;
        let reservations = [];
        let statsData = {}; 
        let currentModalYear = 2025;
        const months = ["4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月", "1月", "2月", "3月"];
        const prices = { "玉掛け": 27000, "クレーン": 37000, "31H": 32000, "11H": 22000, "その他": 15000 };

        signInAnonymously(auth).then(async () => {
            const res = await getDoc(doc(db, "settings", "management_stats_v2"));
            if(res.exists()) statsData = res.data();
            
            // --- [修正] 現在の年度と月を自動計算してセット ---
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1; // 1-12

            // 年度判定（4月以降はその年、3月までは前年を年度とする）
            const currentFY = month >= 4 ? year : year - 1;
            document.getElementById('fiscal-year-select').value = currentFY.toString();

            // 月のインデックス判定（4月=0, 5月=1 ... 3月=11）
            const monthIdx = month >= 4 ? month - 4 : month + 8;
            document.getElementById('target-month-select').value = monthIdx.toString();
            // ----------------------------------------------

            onSnapshot(collection(db, "reservations"), (snap) => {
                reservations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                updateDashboard();
            });
        });

        window.switchModalYear = (year) => {
            currentModalYear = year;
            [2025, 2026, 2027, 2028].forEach(y => {
                const btn = document.getElementById(`tab-${y}`);
                if(btn) btn.className = y === year ? 'px-6 py-2 rounded-t-xl font-black italic text-xs bg-sky-600 text-white' : 'px-6 py-2 rounded-t-xl font-black italic text-xs bg-white/5 text-slate-400';
            });
            window.renderModalTable();
        };

        window.renderModalTable = () => {
            const tbody = document.getElementById('modal-table-body');
            tbody.innerHTML = months.map((m, i) => {
                const key = `${currentModalYear}_${i}`;
                const d = statsData[key] || { t_cnt:0, t_prs:0, c_cnt:0, c_prs:0, f_cnt:0, f_prs:0 };
                return `<tr class="border-b border-white/5">
                    <td class="p-2 text-slate-300 font-bold">${m}</td>
                    <td class="p-1"><input type="number" id="in-${key}-t_cnt" value="${d.t_cnt}"></td>
                    <td class="p-1"><input type="number" id="in-${key}-t_prs" value="${d.t_prs}" class="!text-sky-200 !bg-sky-500/10"></td>
                    <td class="p-1"><input type="number" id="in-${key}-c_cnt" value="${d.c_cnt}"></td>
                    <td class="p-1"><input type="number" id="in-${key}-c_prs" value="${d.c_prs}" class="!text-emerald-200 !bg-emerald-500/10"></td>
                    <td class="p-1"><input type="number" id="in-${key}-f_cnt" value="${d.f_cnt}"></td>
                    <td class="p-1"><input type="number" id="in-${key}-f_prs" value="${d.f_prs}" class="!text-amber-200 !bg-amber-500/10"></td>
                </tr>`;
            }).join('');
        };

        window.savePastData = async () => {
            months.forEach((_, i) => {
                const key = `${currentModalYear}_${i}`;
                statsData[key] = {
                    t_cnt: Number(document.getElementById(`in-${key}-t_cnt`).value),
                    t_prs: Number(document.getElementById(`in-${key}-t_prs`).value), // 実績人数
                    c_cnt: Number(document.getElementById(`in-${key}-c_cnt`).value),
                    c_prs: Number(document.getElementById(`in-${key}-c_prs`).value), // 実績人数
                    f_cnt: Number(document.getElementById(`in-${key}-f_cnt`).value),
                    f_prs: Number(document.getElementById(`in-${key}-f_prs`).value)  // 実績人数
                };
            });
            try { await setDoc(doc(db, "settings", "management_stats_v2"), statsData); alert("保存しました"); window.closePastDataModal(); updateDashboard(); } catch (e) { alert(e.message); }
        };

        function updateDashboard() {
            const fy = document.getElementById('fiscal-year-select').value;
            const targetM = document.getElementById('target-month-select').value;
            const filterC = document.getElementById('course-filter').value;
            const fyData = reservations.filter(r => {
                if(!r.createdAt || r.status === 'revoked') return false;
                const d = r.createdAt.toDate();
                return (d.getMonth() + 1 >= 4 ? d.getFullYear() : d.getFullYear() - 1).toString() === fy;
            });

            let users = 0, sales = 0, afterHours = 0;
            fyData.forEach(r => {
                const d = r.createdAt.toDate();
                const mIdx = d.getMonth() + 1 >= 4 ? d.getMonth() + 1 - 4 : d.getMonth() + 1 + 8;
                if(targetM !== 'all' && mIdx.toString() !== targetM) return;
                const cName = r.courseName || "";
                if(filterC !== 'all' && !cName.includes(filterC)) return;
                users++;
                if(cName.includes("玉掛")) sales += prices["玉掛け"]; else if(cName.includes("クレーン")) sales += prices["クレーン"]; else if(cName.includes("31H")) sales += prices["31H"]; else if(cName.includes("11H")) sales += prices["11H"]; else sales += prices["その他"];
                const h = d.getHours(); if(h < 8 || h >= 17) afterHours++;
            });

            let planCap = 0, pastP = 0;
            if(targetM === 'all') {
                months.forEach((_, i) => {
                    const s = statsData[`${fy}_${i}`] || {}, p = statsData[`${fy-1}_${i}`] || {};
                    if(filterC === '玉掛け') { planCap += (s.t_cnt||0)*8; pastP += p.t_prs||0; }
                    else if(filterC === 'クレーン') { planCap += (s.c_cnt||0)*6; pastP += p.c_prs||0; }
                    else if(filterC === 'フォーク') { planCap += (s.f_cnt||0)*10; pastP += p.f_prs||0; }
                    else { 
                        planCap += (s.t_cnt||0)*8 + (s.c_cnt||0)*6 + (s.f_cnt||0)*10; 
                        pastP += (p.t_prs||0) + (p.c_prs||0) + (p.f_prs||0); 
                    }
                });
            } else {
                const s = statsData[`${fy}_${targetM}`] || {}, p = statsData[`${fy-1}_${targetM}`] || {};
                if(filterC === '玉掛け') { planCap = (s.t_cnt||0)*8; pastP = p.t_prs||0; }
                else if(filterC === 'クレーン') { planCap = (s.c_cnt||0)*6; pastP = p.c_prs||0; }
                else if(filterC === 'フォーク') { planCap = (s.f_cnt||0)*10; pastP = p.f_prs||0; }
                else { planCap = (s.t_cnt||0)*8 + (s.c_cnt||0)*6 + (s.f_cnt||0)*10; pastP = (p.t_prs||0) + (p.c_prs||0) + (p.f_prs||0); }
            }

            document.getElementById('card-users').innerHTML = users + ' <span class="text-xs opacity-40">名</span>';
            document.getElementById('card-empty').innerHTML = Math.max(0, planCap - users) + ' <span class="text-xs opacity-40">席</span>';
            document.getElementById('card-target').innerHTML = (planCap > 0 ? ((users/planCap)*100).toFixed(1) : "--") + ' <span class="text-xs opacity-40">%</span>';
            document.getElementById('card-afterhours').innerHTML = afterHours + ' <span class="text-xs opacity-40">件</span>';
            document.getElementById('card-sales').innerHTML = '¥' + sales.toLocaleString() + ' <span class="text-xs opacity-40">-</span>';
            document.getElementById('card-growth').innerHTML = (pastP > 0 ? ((users/pastP)*100).toFixed(1) : "--") + ' <span class="text-xs opacity-40">%</span>';
            
            renderCharts(fy, fyData);
        }

        function renderCharts(fy, fyData) {
            const counts = { '玉掛け': new Array(12).fill(0), 'フォーク': new Array(12).fill(0), 'クレーン': new Array(12).fill(0) };
            fyData.forEach(r => {
                const d = r.createdAt.toDate();
                const mIdx = d.getMonth() + 1 >= 4 ? d.getMonth() + 1 - 4 : d.getMonth() + 1 + 8;
                if((r.courseName||"").includes("玉掛")) counts['玉掛け'][mIdx]++; else if((r.courseName||"").includes("フォーク")) counts['フォーク'][mIdx]++; else if((r.courseName||"").includes("クレーン")) counts['クレーン'][mIdx]++;
            });
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [
                        { label: '玉掛け', data: counts['玉掛け'], borderColor: '#00a2ff', tension: 0.4 },
                        { label: 'フォーク', data: counts['フォーク'], borderColor: '#10b981', tension: 0.4 },
                        { label: 'クレーン', data: counts['クレーン'], borderColor: '#f59e0b', tension: 0.4 },
                        { label: '前年合計実績', data: months.map((_, i) => { 
                            const p = statsData[`${fy-1}_${i}`] || {}; 
                            return (p.t_prs||0)+(p.c_prs||0)+(p.f_prs||0); 
                        }), borderColor: 'rgba(255,255,255,0.1)', borderDash: [5, 5], tension: 0 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#64748b' } } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }, x: { grid: { display: false }, ticks: { color: '#64748b' } } } }
            });
            const shareCtx = document.getElementById('shareChart').getContext('2d');
            if(shareChart) shareChart.destroy();
            shareChart = new Chart(shareCtx, {
                type: 'doughnut',
                data: { labels: ['玉掛け', 'フォーク', 'クレーン'], datasets: [{ data: Object.values(counts).map(a => a.reduce((s,v)=>s+v,0)), backgroundColor: ['#00a2ff', '#10b981', '#f59e0b'], borderWidth: 0 }] },
                options: { plugins: { legend: { position: 'bottom', labels: { color: '#64748b', font: { size: 10 } } } }, cutout: '75%' }
            });
        }
        document.getElementById('fiscal-year-select').addEventListener('change', updateDashboard);
        document.getElementById('target-month-select').addEventListener('change', updateDashboard);
        document.getElementById('course-filter').addEventListener('change', updateDashboard);

                // --- モーダルの開閉を制御する命令を追加 ---
        window.openPastDataModal = () => {
            window.renderModalTable();
            document.getElementById('past-modal').classList.add('active');
        };

        window.closePastDataModal = () => {
            document.getElementById('past-modal').classList.remove('active');
        };
    </script>
</body>
</html>
