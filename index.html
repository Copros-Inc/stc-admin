<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Dashboard | STC 管理画面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>
    <style>
        .stat-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 25px; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-3px); border-color: rgba(0, 162, 255, 0.2); }
        .stat-number { font-family: 'Montserrat'; font-size: 2.2rem; font-weight: 900; color: #fff; font-style: italic; }
        .stat-label { font-size: 0.65rem; font-weight: 900; color: #64748b; text-transform: uppercase; tracking: 0.1em; }
        .chart-container { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.1); border-radius: 30px; padding: 30px; margin-bottom: 30px; }
        
        /* 入力用モーダル */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #0f172a; border: 2px solid #00a2ff; border-radius: 2.5rem; padding: 40px; width: 95%; max-width: 900px; max-height: 85vh; overflow-y: auto; }
        .past-input-grid input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px; width: 100%; border-radius: 8px; text-align: center; font-family: 'Montserrat'; font-weight: bold; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="admin-page-title">Operational Intelligence</h1>
                <p class="admin-page-subtitle">月次実績分析と次期年度計画のシミュレーション</p>
            </div>
            <div class="flex gap-3">
                <button onclick="openPastDataModal()" class="bg-white/5 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 px-5 py-2 rounded-xl font-black italic text-xs transition flex items-center gap-2">
                    <i class="fas fa-database"></i> 過去・目標値の編集
                </button>
                <select id="fiscal-year-select" class="bg-slate-900 border border-white/10 rounded-xl px-4 py-2 font-bold text-sky-400 outline-none focus:border-sky-500 transition-all">
                    <option value="2026">2026年度 (R8)</option>
                    <option value="2025">2025年度 (R7)</option>
                </select>
            </div>
        </div>

        <!-- フィルター -->
        <div class="bg-white/5 border border-white/5 p-6 rounded-[2rem] mb-10 flex flex-wrap items-center justify-center gap-8 shadow-inner">
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest italic">Target Month</span>
                <select id="target-month-select" class="bg-slate-900 border border-white/10 rounded-xl px-6 py-2 font-black text-sky-400 outline-none focus:border-sky-500 transition-all">
                    <option value="all">年度通期累計 (4月 - 3月)</option>
                    <option value="0">4月</option><option value="1">5月</option><option value="2">6月</option><option value="3">7月</option>
                    <option value="4">8月</option><option value="5">9月</option><option value="6">10月</option><option value="7">11月</option>
                    <option value="8">12月</option><option value="9">1月</option><option value="10">2月</option><option value="11">3月</option>
                </select>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest italic">Course Filter</span>
                <select id="course-filter" class="bg-slate-900 border border-white/10 rounded-xl px-6 py-2 font-black text-sky-400 outline-none focus:border-sky-500 transition-all">
                    <option value="all">すべての講習を表示</option>
                    <option value="玉掛け">玉掛け技能講習</option>
                    <option value="クレーン">小型移動式クレーン</option>
                    <option value="フォーク">フォークリフト運転</option>
                </select>
            </div>
        </div>

        <!-- カード -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="stat-card border-l-4 border-sky-500">
                <div class="stat-label">受講者数</div>
                <div class="stat-number" id="card-users">0 <span class="text-xs italic opacity-40">名</span></div>
            </div>
            <div class="stat-card border-l-4 border-emerald-500">
                <div class="stat-label">売上実績 (概算)</div>
                <div class="stat-number text-emerald-400" id="card-sales">¥0 <span class="text-xs italic opacity-40">-</span></div>
            </div>
            <div class="stat-card border-l-4 border-purple-500">
                <div class="stat-label">前年同期比 (受講者)</div>
                <div class="stat-number text-purple-400" id="card-growth">-- <span class="text-xs italic opacity-40">%</span></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-3 chart-container">
                <h3 class="font-[900] italic text-sky-400 uppercase tracking-tighter mb-8">Performance Trend</h3>
                <div style="height: 400px;"><canvas id="mainChart"></canvas></div>
            </div>
            <div class="lg:col-span-1 stat-card">
                <h3 class="stat-label mb-8 text-center text-sky-400">Course Share</h3>
                <div class="aspect-square"><canvas id="shareChart"></canvas></div>
            </div>
        </div>
    </div>

    <!-- 過去・目標データ入力モーダル -->
    <div id="past-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
                <h2 class="text-2xl font-black italic text-sky-400">Data Supplement & Target Setting</h2>
                <button onclick="closePastDataModal()" class="text-slate-500 hover:text-white text-3xl">&times;</button>
            </div>
            
            <p class="text-xs text-slate-400 mb-6 italic leading-relaxed">
                年度別の受講者数を講習ごとに入力・編集します。9月以前のデータがない期間の補完や、前年度実績の修正を行えます。
            </p>

            <div class="space-y-8">
                <div>
                    <h3 id="modal-fy-label" class="text-xs font-black text-slate-200 uppercase tracking-widest mb-4">2025年度 実績データ</h3>
                    <div id="past-input-container" class="grid grid-cols-3 md:grid-cols-6 gap-4 past-input-grid">
                        <!-- JSで生成 -->
                    </div>
                </div>
            </div>

            <button onclick="savePastData()" class="w-full mt-10 bg-sky-600 hover:bg-sky-500 text-white py-5 rounded-2xl font-black italic transition shadow-xl shadow-sky-600/20">
                データを保存して分析結果を更新する
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        const firebaseConfig = { apiKey: "AIza...", authDomain: "stc-hp.firebaseapp.com", projectId: "stc-hp", storageBucket: "stc-hp.firebasestorage.app", messagingSenderId: "795332931918", appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let mainChart, shareChart;
        let reservations = [];
        let pastData = {};
        const months = ["4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月", "1月", "2月", "3月"];
        const prices = { "玉掛け": 27000, "クレーン": 37000, "31H": 32000, "11H": 22000, "その他": 15000 };

        signInAnonymously(auth).then(async () => {
            const pastDoc = await getDoc(doc(db, "settings", "past_statistics"));
            if(pastDoc.exists()) pastData = pastDoc.data();
            
            onSnapshot(collection(db, "reservations"), (snap) => {
                reservations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                updateDashboard();
            });
        });

        function updateDashboard() {
            const fy = document.getElementById('fiscal-year-select').value;
            const targetM = document.getElementById('target-month-select').value;
            const filterC = document.getElementById('course-filter').value;

            const fyData = reservations.filter(r => {
                if(!r.createdAt || r.status === 'revoked') return false;
                const d = r.createdAt.toDate();
                const m = d.getMonth() + 1;
                const y = d.getFullYear();
                const resFY = m >= 4 ? y : y - 1;
                return resFY.toString() === fy;
            });

            const cardFiltered = fyData.filter(r => {
                const d = r.createdAt.toDate();
                const m = d.getMonth() + 1;
                const mIdx = m >= 4 ? m - 4 : m + 8;
                const matchM = targetM === 'all' || mIdx.toString() === targetM;
                const matchC = filterC === 'all' || (r.courseName || "").includes(filterC);
                return matchM && matchC;
            });

            const totalSales = cardFiltered.reduce((sum, r) => {
                const name = r.courseName || "";
                if(name.includes("玉掛")) return sum + prices["玉掛け"];
                if(name.includes("クレーン")) return sum + prices["クレーン"];
                if(name.includes("31H")) return sum + prices["31H"];
                if(name.includes("11H")) return sum + prices["11H"];
                return sum + prices["その他"];
            }, 0);

            let growth = "--";
            if(targetM !== 'all') {
                const pastVal = pastData[`${fy-1}_${targetM}`] || 0;
                if(pastVal > 0) growth = ((cardFiltered.length / pastVal) * 100).toFixed(1);
            }

            document.getElementById('card-users').innerHTML = cardFiltered.length + ' <span class="text-xs italic opacity-40">名</span>';
            document.getElementById('card-sales').innerHTML = '¥' + totalSales.toLocaleString() + ' <span class="text-xs italic opacity-40">-</span>';
            document.getElementById('card-growth').innerHTML = growth + ' <span class="text-xs italic opacity-40">%</span>';

            renderCharts(fy, fyData);
        }

        function renderCharts(fy, fyData) {
            const counts = { '玉掛け': new Array(12).fill(0), 'フォーク': new Array(12).fill(0), 'クレーン': new Array(12).fill(0), 'その他': new Array(12).fill(0) };
            fyData.forEach(r => {
                const d = r.createdAt.toDate();
                const m = d.getMonth() + 1;
                const mIdx = m >= 4 ? m - 4 : m + 8;
                const name = r.courseName || "";
                if(name.includes("玉掛")) counts['玉掛け'][mIdx]++;
                else if(name.includes("フォーク")) counts['フォーク'][mIdx]++;
                else if(name.includes("クレーン")) counts['クレーン'][mIdx]++;
                else counts['その他'][mIdx]++;
            });

            const ctx = document.getElementById('mainChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [
                        { label: '玉掛け', data: counts['玉掛け'], borderColor: '#00a2ff', tension: 0.4 },
                        { label: 'フォーク', data: counts['フォーク'], borderColor: '#10b981', tension: 0.4 },
                        { label: 'クレーン', data: counts['クレーン'], borderColor: '#f59e0b', tension: 0.4 },
                        { label: '前年合計実績', data: months.map((_, i) => pastData[`${fy-1}_${i}`] || 0), borderColor: 'rgba(255,255,255,0.2)', borderDash: [5, 5], fill: true, backgroundColor: 'rgba(255,255,255,0.02)', tension: 0 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#64748b', font: { weight: 'bold' } } } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }, x: { grid: { display: false }, ticks: { color: '#64748b' } } } }
            });

            const shareCtx = document.getElementById('shareChart').getContext('2d');
            if(shareChart) shareChart.destroy();
            shareChart = new Chart(shareCtx, {
                type: 'doughnut',
                data: {
                    labels: ['玉掛け', 'フォーク', 'クレーン', 'その他'],
                    datasets: [{ data: Object.values(counts).map(arr => arr.reduce((a,b)=>a+b,0)), backgroundColor: ['#00a2ff', '#10b981', '#f59e0b', '#334155'], borderWidth: 0 }]
                },
                options: { plugins: { legend: { position: 'bottom', labels: { color: '#64748b', font: { size: 10 } } } }, cutout: '70%' }
            });
        }

        window.openPastDataModal = () => {
            const container = document.getElementById('past-input-container');
            const fy = document.getElementById('fiscal-year-select').value;
            document.getElementById('modal-fy-label').innerText = `${fy-1}年度 実績データ入力`;
            container.innerHTML = months.map((m, i) => `
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                    <span class="block text-[10px] text-slate-500 font-bold mb-2 text-center">${fy-1}年 ${m}</span>
                    <input type="number" id="past-${fy-1}-${i}" value="${pastData[`${fy-1}_${i}`] || 0}" class="w-full">
                </div>
            `).join('');
            document.getElementById('past-modal').classList.add('active');
        };

        window.closePastDataModal = () => document.getElementById('past-modal').classList.remove('active');

        window.savePastData = async () => {
            const fy = document.getElementById('fiscal-year-select').value;
            months.forEach((m, i) => pastData[`${fy-1}_${i}`] = Number(document.getElementById(`past-${fy-1}-${i}`).value));
            try { 
                await setDoc(doc(db, "settings", "past_statistics"), pastData); 
                alert("統計データを保存しました。グラフに反映します。"); 
                closePastDataModal();
                updateDashboard(); 
            } catch (e) { alert("保存エラー: " + e.message); }
        };

        document.getElementById('fiscal-year-select').addEventListener('change', updateDashboard);
        document.getElementById('target-month-select').addEventListener('change', updateDashboard);
        document.getElementById('course-filter').addEventListener('change', updateDashboard);
    </script>
</body>
</html>
