<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC 管理画面 | ダッシュボード</title>
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- ★共通パーツの読み込み -->
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>

    <style>
        /* ダッシュボード専用：スタッツカード等の微調整 */
        .stat-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 30px; text-align: center; }
        .stat-number { font-family: 'Montserrat'; font-size: 2.5rem; font-weight: 900; color: #00a2ff; font-style: italic; }
        .stat-label { font-size: 0.7rem; font-weight: 900; color: #64748b; text-transform: uppercase; margin-top: 5px; tracking: 0.1em; }
        
        .menu-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(56, 189, 248, 0.1); border-radius: 24px; padding: 35px; transition: 0.3s; text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .menu-card:hover { background: rgba(56, 189, 248, 0.05); border-color: #00a2ff; transform: translateY(-5px); }
        .menu-card i { font-size: 2rem; color: #00a2ff; margin-bottom: 20px; }
        .menu-card h3 { font-size: 1.1rem; font-[900]; italic: true; margin-bottom: 10px; color: #f1f5f9; }
        .menu-card p { font-size: 0.75rem; color: #64748b; font-weight: bold; line-height: 1.5; }
    </style>
</head>
<body>
    <!-- サイドバーは common.js が自動で挿入します -->

    <div class="main-content">
        <div class="flex justify-between items-start mb-10">
            <div>
                <!-- 共通スタイルの水色タイトル -->
                <h1 class="admin-page-title">Dashboard</h1>
                <p class="admin-page-subtitle">システム全体の統計とクイックアクセス</p>
            </div>
            <div class="text-right">
                <p id="today-display" class="font-black italic text-slate-500 text-sm tracking-widest"></p>
            </div>
        </div>

        <!-- 月別フィルター -->
        <div class="bg-white/5 border border-white/5 p-6 rounded-3xl mb-10 flex flex-wrap items-center justify-center gap-8">
            <div class="flex items-center gap-6">
                <button onclick="changeMonth(-1)" class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center hover:bg-sky-500 transition-all cursor-pointer"><i class="fas fa-chevron-left"></i></button>
                <span id="current-month-display" class="font-[900] italic text-3xl text-sky-400 min-w-[160px] text-center font-en">2026年 7月</span>
                <button onclick="changeMonth(1)" class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center hover:bg-sky-500 transition-all cursor-pointer"><i class="fas fa-chevron-right"></i></button>
            </div>
            <select id="course-filter" class="bg-slate-900 border border-white/10 rounded-xl px-6 py-3 font-bold text-sm outline-none focus:border-sky-500 transition-all text-white">
                <option value="all">すべての講習コース</option>
                <option value="玉掛け">玉掛け技能講習</option>
                <option value="フォーク">フォークリフト運転</option>
                <option value="クレーン">小型移動式クレーン</option>
                <option value="テール">テールゲートリフター</option>
            </select>
        </div>
        
        <!-- 統計情報 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="stat-card border-b-4 border-b-sky-500">
                <div class="stat-number" id="monthly-schedules">0</div>
                <div class="stat-label">選択月の開催数</div>
            </div>
            <div class="stat-card border-b-4 border-b-emerald-500">
                <div class="stat-number" id="monthly-reservations">0</div>
                <div class="stat-label">選択月の予約数</div>
            </div>
            <div class="stat-card border-b-4 border-b-amber-500">
                <div class="stat-number" id="monthly-available">0</div>
                <div class="stat-label">選択月の空席合計</div>
            </div>
        </div>
        
        <!-- クイックメニュー -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <a href="schedule.html" class="menu-card">
                <i class="fas fa-calendar-plus"></i>
                <h3>スケジュール</h3>
                <p>カレンダー更新と日程追加</p>
            </a>
            <a href="reservations.html" class="menu-card">
                <i class="fas fa-user-check"></i>
                <h3>予約受付</h3>
                <p>HPからの申込みを確認</p>
            </a>
            <a href="blog-manager.html" class="menu-card border-accent/30 bg-accent/5">
                <i class="fas fa-edit"></i>
                <h3>ブログ投稿</h3>
                <p>現場レポートを即時アップ</p>
            </a>
            <a href="news.html" class="menu-card">
                <i class="fas fa-bullhorn"></i>
                <h3>お知らせ</h3>
                <p>トップへの緊急告知管理</p>
            </a>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw", 
            authDomain: "stc-hp.firebaseapp.com", 
            projectId: "stc-hp", 
            storageBucket: "stc-hp.firebasestorage.app", 
            messagingSenderId: "795332931918", 
            appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentYear = 2026;
        let currentMonth = 7;
        let allSchedules = [];
        let allReservations = [];

        window.changeMonth = (diff) => {
            currentMonth += diff;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            updateDisplay();
        };

        function updateDisplay() {
            document.getElementById('current-month-display').innerText = `${currentYear}年 ${currentMonth}月`;
            const courseFilter = document.getElementById('course-filter').value;
            const filteredSchedules = allSchedules.filter(s => {
                const sMonth = Number(s.month);
                const matchMonth = sMonth === currentMonth;
                const matchCourse = courseFilter === 'all' || (s.courseName && s.courseName.includes(courseFilter));
                return matchMonth && matchCourse;
            });
            document.getElementById('monthly-schedules').textContent = filteredSchedules.length;
            document.getElementById('monthly-reservations').textContent = allReservations.filter(r => courseFilter === 'all' || (r.courseName && r.courseName.includes(courseFilter))).length;
            
            let totalAvailable = 0;
            filteredSchedules.forEach(s => {
                totalAvailable += ((Number(s.capacity) || 10) - (Number(s.reserved) || 0));
            });
            document.getElementById('monthly-available').textContent = totalAvailable;
        }

        signInAnonymously(auth).then(() => {
            onSnapshot(collection(db, "schedules"), (snap) => {
                allSchedules = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateDisplay();
            });
            onSnapshot(collection(db, "reservations"), (snap) => {
                allReservations = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateDisplay();
            });
        });

        document.getElementById('course-filter').addEventListener('change', updateDisplay);
        document.getElementById('today-display').innerText = new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
    </script>
</body>
</html>
