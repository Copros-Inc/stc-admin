<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約受付管理 | STC 管理画面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- ★共通パーツの読み込み -->
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>

    <style>
        /* 予約管理専用の追加スタイル */
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 25px; text-align: center; }
        .stat-val { font-family: 'Montserrat'; font-size: 2rem; font-weight: 900; color: #fff; font-style: italic; }
        .stat-lab { font-size: 0.7rem; color: #64748b; font-weight: 900; text-transform: uppercase; margin-top: 5px; }

        .admin-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1000px; }
        .admin-table th { padding: 20px; font-weight: 900; color: #00a2ff; font-size: 0.7rem; text-transform: uppercase; background: rgba(56, 189, 248, 0.05); border-bottom: 1px solid rgba(56, 189, 248, 0.2); }
        .admin-table td { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.02); vertical-align: middle; color: #f1f5f9; font-weight: 700; }

        .tag-mode { font-size: 0.65rem; padding: 4px 10px; border-radius: 6px; font-[900]; white-space: nowrap; }
        .mode-full { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .mode-simple { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #0f172a; border: 1px solid #00a2ff; border-radius: 3rem; padding: 50px; width: 95%; max-width: 1200px; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 100px rgba(0, 162, 255, 0.1); }
        
        .btn-mail-action { background: #00a2ff; color: #0f172a; padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 900; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 4px; }
        .btn-mail-action:hover { background: #fff; transform: scale(1.02); }
        .new-dot { background: #ef4444; width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 10px #ef4444; }

        /* プレビューコンテナの追加 */
.preview-frame { 
    background: #fff; 
    color: #000; 
    width: 100%; 
    height: 700px; 
    overflow-y: auto; 
    border-radius: 10px; 
    padding: 10mm; 
    box-shadow: inset 0 0 20px rgba(0,0,0,0.2); 
    transform-origin: top left;
}
.preview-container { height: 700px; position: relative; }

    <style>
        /* 新しいトリミング画面のスタイル */
        .crop-v-container { position: relative; width: 300px; height: 375px; margin: 0 auto; overflow: hidden; background: #000; border: 2px solid #00a2ff; border-radius: 10px; cursor: move; }
        #crop-v-image { position: absolute; top: 0; left: 0; transform-origin: top left; user-select: none; }
        .crop-v-overlay { position: absolute; inset: 0; border: 20px solid rgba(0,0,0,0.5); pointer-events: none; }
    </style>

    <style>
        /* トリミングモーダル用スタイル */
        .cropper-container { max-height: 500px; width: 100%; background: #000; overflow: visible !important; position: relative; }
        .crop-modal-content { background: #0f172a; border: 2px solid #00a2ff; border-radius: 2rem; padding: 30px; width: 95%; max-width: 800px; z-index: 2000; }
        #cropper-image { display: block; max-width: 100%; height: auto; }
        /* Cropperの枠を強制的に見えるようにする */
        .cropper-view-box, .cropper-face { border-radius: 0; }
    </style>
</head>
<body>
    <!-- サイドバーは common.js が自動生成 -->

    <div class="main-content">
        <h1 class="admin-page-title">Reservations</h1>
        <p class="admin-page-subtitle">受講申込・キャンセル待ちのリアルタイム管理</p>

        <!-- 統計エリア -->
        <div class="stat-grid">
            <div class="stat-card" style="border-top: 4px solid #00a2ff;"><div class="stat-val" id="stat-today">0</div><div class="stat-lab">本日申込</div></div>
            <div class="stat-card" style="border-top: 4px solid #ef4444;"><div class="stat-val text-red-500" id="stat-new">0</div><div class="stat-lab">未読(バッジ)</div></div>
            <div class="stat-card" style="border-top: 4px solid #f59e0b;"><div class="stat-val text-amber-500" id="stat-wait">0</div><div class="stat-lab">キャンセル待ち</div></div>
            <div class="stat-card" style="border-top: 4px solid #94a3b8;"><div class="stat-val" id="stat-total">0</div><div class="stat-lab">累計申込</div></div>
        </div>

        <!-- テーブルエリア -->
        <div class="admin-card !p-0 overflow-hidden">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th onclick="window.sortTable('createdAt')" class="cursor-pointer">受付日時 <i class="fas fa-sort ml-1"></i></th>
                        <th>No.</th>
                        <th>種別</th>
                        <th onclick="window.sortTable('courseName')" class="cursor-pointer">講習名 / 日程 <i class="fas fa-sort ml-1"></i></th>
                        <th>受講生名</th>
                        <th>会社名</th>
                        <th>メール連絡</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="res-list"></tbody>
            </table>
        </div>
    </div>

    <!-- 詳細表示モーダル -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-10 border-b border-white/10 pb-6">
                <h2 class="text-3xl font-[900] italic text-sky-400 uppercase tracking-tighter">Application Details</h2>
                <button onclick="closeModal()" class="text-slate-500 hover:text-white text-4xl">&times;</button>
            </div>
            <div id="modal-body" class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left"></div>
            <div class="mt-12 flex flex-wrap gap-6 pt-10 border-t border-white/5">
                
            </div>
        </div>
    </div>

    <!-- ロジック部分は一切変えずに維持 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, getDocs, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw", 
            authDomain: "stc-hp.firebaseapp.com", 
            projectId: "stc-hp", 
            storageBucket: "stc-hp.firebasestorage.app", 
            messagingSenderId: "795332931918", 
            appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let reservations = [];
        let currentSort = { key: 'createdAt', order: 'desc' };

        signInAnonymously(auth).then(() => {
            onSnapshot(collection(db, "reservations"), (snap) => {
                reservations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                updateDashboard();
                renderTable();
            });
        });

        function updateDashboard() {
            const today = new Date().toLocaleDateString();
            document.getElementById('stat-today').innerText = reservations.filter(r => r.createdAt?.toDate().toLocaleDateString() === today).length;
            const unread = reservations.filter(r => !r.mailStatus).length;
            document.getElementById('stat-new').innerText = unread;
            document.getElementById('stat-wait').innerText = reservations.filter(r => r.status === 'waiting').length;
            document.getElementById('stat-total').innerText = reservations.length;
        }

        window.sortTable = (key) => {
            if (currentSort.key === key) currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
            else { currentSort.key = key; currentSort.order = 'asc'; }
            renderTable();
        };

        window.renderTable = function() {
            const listEl = document.getElementById('res-list');
            const sorted = [...reservations].sort((a, b) => {
                let valA = a[currentSort.key]; let valB = b[currentSort.key];
                if (currentSort.key === 'createdAt') { valA = valA?.toDate() || 0; valB = valB?.toDate() || 0; }
                if (valA < valB) return currentSort.order === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.order === 'asc' ? 1 : -1;
                return 0;
            });

            listEl.innerHTML = sorted.map(r => {
                const dateStr = r.createdAt?.toDate().toLocaleString('ja-JP') || '-';
                const isSent = r.mailStatus === 'sent' ? '<span class="text-[9px] text-emerald-400 font-[900] block mt-1 text-center italic">✅ 送信済</span>' : '';
                const cleanCourseName = typeof r.courseName === 'string' ? r.courseName.split(',')[0].trim() : r.courseName;
                const cleanCourseDate = typeof r.courseDate === 'string' ? r.courseDate.split(',')[0].trim() : r.courseDate;

                let mailBtn = "";
                if(r.status === 'waiting') mailBtn = `<button class="btn-mail-action !bg-amber-600 !text-white" onclick="window.sendMail('${r.id}', 'waiting')">待機案内</button>`;
                else if(r.mode === 'full') mailBtn = `<button class="btn-mail-action" onclick="window.sendMail('${r.id}', 'guide')">受講案内</button>`;
                else mailBtn = `<button class="btn-mail-action !bg-yellow-500 !text-slate-900" onclick="window.sendMail('${r.id}', 'simple')">本申込依頼</button>`;

                let modeTag = "";
                if (r.status === 'waiting') {
                    modeTag = `<span class="tag-mode mode-simple" style="background:rgba(239,68,68,0.2); color:#ef4444; border-color:rgba(239,68,68,0.3);">キャンセル待ち</span>`;
                } else {
                    modeTag = `<span class="tag-mode ${r.mode === 'full' ? 'mode-full' : 'mode-simple'}">${r.mode === 'full' ? '本申込' : '仮予約'}</span>`;
                }

                return `<tr>
                    <td class="text-white font-bold font-en text-[11px]">${dateStr}</td>
                    <td class="text-sky-400 font-black italic text-[10px]">${r.regNo || '-'}</td>
                    <td>${modeTag}</td>
                    <td><div class="text-[#00a2ff] font-[900] italic text-sm">${cleanCourseName}</div><div class="text-[10px] text-white opacity-60 font-en font-bold">${cleanCourseDate}</div></td>
                    <td class="font-[900] italic text-white text-lg">${!r.mailStatus ? '<span class="new-dot"></span>' : ''}${r.userName}</td>
                    <td class="text-slate-300 font-bold text-xs italic">${r.company || '-'}</td>
                    <td><div class="w-32">${mailBtn}${isSent}</div></td>
                    <td><button class="bg-white/10 hover:bg-white/20 text-white text-[10px] px-5 py-2 rounded-lg font-black shadow-lg transition" onclick="window.openDetail('${r.id}')">詳細</button></td>
                </tr>`;
            }).join('');
        };

        window.openDetail = (id) => {
            const r = reservations.find(item => item.id === id);
            const body = document.getElementById('modal-body');
            const photoSrc = r.userPhotoBase64 || (r.photos && typeof r.photos === 'object' ? r.photos.user : (typeof r.photos === 'string' ? r.photos : null));
            
            // 編集用入力行の生成関数
            const editRow = (label, field, val) => `
                <div class="mb-4 border-b border-white/5 pb-1 text-left">
                    <span class="block text-[9px] font-black text-sky-400 uppercase tracking-widest mb-1 italic">${label}</span>
                    <input type="text" id="edit-${field}" value="${val || ''}" class="bg-transparent text-white font-bold text-sm w-full outline-none focus:text-sky-300 transition">
                </div>`;

            // モード判定バッジ
            const modeBadge = r.status === 'waiting' 
                ? `<span class="bg-red-500/20 text-red-500 border border-red-500/30 px-4 py-1 rounded-full text-[10px] font-black italic uppercase tracking-widest">キャンセル待ち</span>`
                : (r.mode === 'full' 
                    ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-4 py-1 rounded-full text-[10px] font-black italic uppercase tracking-widest">本申込済</span>`
                    : `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-4 py-1 rounded-full text-[10px] font-black italic uppercase tracking-widest">仮予約中</span>`);

            body.innerHTML = `
                <!-- 最上部：ステータスバッジ -->
                <div class="md:col-span-3 mb-2 flex items-center gap-4">
                    ${modeBadge}
                    <div class="h-[1px] flex-1 bg-white/10"></div>
                </div>

                <!-- 左側：写真とステータス -->
                <div class="md:col-span-1 space-y-6 text-left">
                    <div class="bg-white/5 p-6 rounded-[2rem] border border-white/10 text-center flex flex-col items-center justify-center shadow-inner">
                        <div class="w-full mb-4">
                            ${photoSrc 
                                ? `<img src="${photoSrc}" id="target-photo-${r.id}" class="photo-click-target w-full rounded-2xl shadow-2xl border-2 border-white/10 cursor-pointer hover:opacity-80 transition" title="クリックしてトリミング">` 
                                : '<div class="py-20 text-slate-600 italic text-[10px] border-2 border-dashed border-white/5 rounded-2xl w-full flex flex-col items-center justify-center gap-2"><i class="fas fa-camera text-2xl opacity-20"></i>写真は未送付</div>'}
                        </div>
                        <div class="grid grid-cols-2 gap-2 w-full mt-2">
                            <button onclick="window.toggleStatus('${r.id}', 'paymentStatus', '${r.paymentStatus || ''}')" class="bg-slate-800 ${r.paymentStatus === 'paid' ? 'text-emerald-400 border-emerald-500' : 'text-slate-500 border-white/10'} border px-2 py-3 rounded-xl font-black text-[9px] transition">
                                ${r.paymentStatus === 'paid' ? '💰 入金済' : '💸 未入金'}
                            </button>
                            <button onclick="window.toggleStatus('${r.id}', 'docStatus', '${r.docStatus || ''}')" class="bg-slate-800 ${r.docStatus === 'complete' ? 'text-sky-400 border-sky-500' : 'text-slate-500 border-white/10'} border px-2 py-3 rounded-xl font-black text-[9px] transition">
                                ${r.docStatus === 'complete' ? '📄 書類完了' : '📝 書類未済'}
                            </button>
                        </div>
                    </div>
                    <div class="bg-sky-500/5 p-6 rounded-[2rem] border border-sky-500/10 text-left">
                        <p class="text-sky-500 font-black italic text-[9px] uppercase mb-2 tracking-widest">Course Info</p>
                        <p class="text-white font-bold text-xs leading-relaxed">${r.courseName || ''}<br><span class="text-sky-300/60 font-en text-[10px]">${r.courseDate || ''}</span></p>
                    </div>
                </div>

                <!-- 右側：編集フォーム -->
                <div class="md:col-span-2">
                    <div class="bg-white/5 p-8 rounded-[2rem] border border-white/10 shadow-2xl">
                        <h3 class="text-sky-500 font-black italic text-sm mb-6 border-b border-sky-500/20 pb-2 uppercase flex items-center justify-between">
                            <span><i class="fas fa-edit mr-2"></i> Application Details</span>
                            <span class="text-[10px] text-slate-500 font-en font-bold text-right">${id.substring(0,8)}...</span>
                        </h3>
                        <div class="grid md:grid-cols-2 gap-x-8 gap-y-2">
                            ${editRow("受付番号", "regNo", r.regNo)}
                            ${editRow("氏名（漢字）", "userName", r.userName)}
                            ${editRow("フリガナ", "userKana", r.userKana)}
                            ${editRow("生年月日", "birthDate", r.birthDate)}
                            ${editRow("旧姓・通称の併記", "maidenName", r.maidenName)}
                            ${editRow("電話番号", "phone", r.phone)}
                            ${editRow("メールアドレス", "email", r.email)}
                            ${editRow("現住所（〒）", "zip", r.zip)}
                            <div class="md:col-span-2">${editRow("現住所（県・市・番地）", "address", r.address)}</div>
                            <div class="md:col-span-2 border-t border-white/5 my-4 pt-2 text-sky-600 text-[10px] font-black uppercase italic tracking-widest">Employment & Receipt</div>
                            ${editRow("会社名", "company", r.company)}
                            ${editRow("会社電話", "compPhone", r.compPhone)}
                            ${editRow("会社住所（〒）", "compZip", r.compZip)}
                            ${editRow("会社住所（住所）", "compAddress", r.compAddress)}
                            ${editRow("助成金利用", "subsidy", r.subsidy)}
                            ${editRow("領収書宛名", "receiptName", r.receiptName)}
                            <div class="md:col-span-2 border-t border-white/5 my-4 pt-2 text-sky-600 text-[10px] font-black uppercase italic tracking-widest">Qualification / Exemptions</div>
                            ${editRow("免除区分", "exType", r.exType)}
                            ${editRow("修了証/免許番号", "exNo", r.exNoA || r.exNo || r.licNo)}
                            ${editRow("交付機関/取得日", "exInfo", r.exOrgA || r.exDateA || r.exDateB)}
                        </div>
                        <button onclick="window.saveReservationEdit('${r.id}')" class="w-full mt-8 bg-sky-600 hover:bg-sky-500 text-white py-4 rounded-2xl font-black italic uppercase transition text-sm shadow-xl shadow-sky-600/20 flex items-center justify-center gap-2">
                            <i class="fas fa-save"></i> 編集内容を保存する
                        </button>
                    </div>
                </div>

                <!-- 下部：アクションボタン（横並び） -->
                <div class="md:col-span-3 mt-8 flex flex-row items-center justify-start gap-4 p-6 bg-white/5 rounded-3xl border border-white/5 overflow-x-auto">
                    <button id="btn-accept-final" class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-4 rounded-xl font-black italic shadow-lg transition text-sm flex-1 min-w-[120px] whitespace-nowrap">受付を確定</button>
                    <button onclick="window.downloadExcel('${r.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-4 rounded-xl font-black italic shadow-lg transition text-sm flex-1 min-w-[180px] whitespace-nowrap flex items-center justify-center gap-2"><i class="fas fa-file-excel"></i> 正式申込書(Excel)</button> 
                    <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-8 py-4 rounded-xl font-black italic transition text-sm flex-1 min-w-[100px] whitespace-nowrap">閉じる</button>
                    <button id="btn-delete-final" class="bg-red-900/30 hover:bg-red-900/50 text-red-400 px-6 py-4 rounded-xl font-black italic text-[11px] transition ml-auto whitespace-nowrap">削除</button>
                </div>`;

            document.getElementById('btn-accept-final').onclick = () => window.processAction(r.id, 'accepted', r);
            document.getElementById('btn-delete-final').onclick = () => window.deleteRes(r.id);
            
            // ★ここに追加
            const photoEl = document.getElementById('target-photo-' + id);
            if(photoEl) {
                photoEl.onclick = () => window.openCropper(id);
            }

            document.getElementById('modal-overlay').classList.add('active');
        };
        
        window.processAction = async (id, status, r) => {
            if(!confirm(`ステータスを更新しますか？`)) return;
            try {
                let updateData = { status: status };

                // --- [修正版] 採番ロジックの安全化 ---
                if (status === 'accepted' && !r.regNo) {
                    const qCount = query(collection(db, "reservations"), 
                        where("courseName", "==", r.courseName), 
                        where("courseDate", "==", r.courseDate));
                    const countSnap = await getDocs(qCount);
                    const confirmedUsers = countSnap.docs.filter(doc => doc.data().regNo);
                    const nextNum = confirmedUsers.length + 1;

                    const prefix = (r.courseName || "講習").substring(0, 2); 
                    
                    let datePart = "0000";
                    // 安全に日付を抽出する処理
                    try {
                        if (r.courseDate && typeof r.courseDate === 'string' && r.courseDate.includes('/')) {
                            const firstDate = r.courseDate.split('-')[0].trim();
                            const parts = firstDate.split('/');
                            if (parts.length >= 2) {
                                // 月と日をそれぞれ2桁で固定
                                const m = parts[0].replace(/[^0-9]/g, '').padStart(2, '0');
                                const d = parts[1].replace(/[^0-9]/g, '').padStart(2, '0');
                                datePart = m + d;
                            }
                        }
                    } catch (e) { console.error("Date parse error", e); }
                    
                    const regNo = `${prefix}-${datePart}-${nextNum}`;
                    updateData.regNo = regNo;
                    r.regNo = regNo;
                }
                await updateDoc(doc(db, "reservations", id), updateData);

                // schedules側のカウント更新（リアルタイム残数連動）
                       // schedules側のカウント更新（ウェブ申込以外の手動時のみ実行）
                if(status === 'accepted') {
                    // メモ欄にウェブ申込の痕跡がない場合のみ、席数をマイナスする
                    const isWebApply = r.memo && (r.memo.includes("新規申込") || r.memo.includes("移行"));
                    
                    if (!isWebApply) {
                        const q = query(collection(db, "schedules"), where("courseName", "==", r.courseName), where("date", "==", r.courseDate));
                        const snap = await getDocs(q);
                        if(!snap.empty) {
                            const sched = snap.docs[0];
                            const field = r.mode === 'full' ? 'fullApplied' : 'reserved';
                            await updateDoc(doc(db, "schedules", sched.id), { [field]: (sched.data()[field] || 0) + 1 });
                        }
                    }
                }
                
                alert(`更新完了！${updateData.regNo ? '\n発行された受付番号：' + updateData.regNo : ''}`);
                // 確定時はメールを送りません。一覧のボタンから手動で送る運用です。
                closeModal();
            } catch (e) { alert("エラー: " + e.message); }
        };

        window.sendMail = async (id, type) => {
            const r = reservations.find(item => item.id === id);
            const btn = event?.target;
            if(btn && btn.tagName === 'BUTTON') btn.innerText = "送信中...";

            const baseUrl = "https://shimonoseki-tc.com/pdf/";
            let pdfUrl = ""; 
            let guideUrl = `${baseUrl}guide_special.pdf`;
            const cName = r.courseName || "";
            if (cName.includes("玉掛け")) {

                                Web本申込手続きへ進む

            const emailParams = {

                email: r.email,

                    ? "【本申込のお願い】仮予約ありがとうございます。内容を確認いたしました。7日以内に以下のボタンより本申込のお手続きをお願いいたします。" 
                    : "【本申込・完了】お申し込み内容およびお写真を正しく受領いたしました。本申込の手続きが全て完了しましたことを通知いたします。"
            };
            
            try {
                await emailjs.send("service_ry0ghki", "template_1g454mr", emailParams);

        window.generatePrintHTML = (r) => {
            const today = new Date();
            const applyYear = today.getFullYear() - 2018;

            const photoSrc = r.userPhotoBase64 || (r.photos && typeof r.photos === 'object' ? r.photos.user : (typeof r.photos === 'string' ? r.photos : null));


            return `
                <div style="font-family: 'serif'; color: #000; position: relative; padding-left: 5mm;">

                    </div>

                    <!-- ヘッダー -->
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2mm;">
                        <div style="border: 1px solid #000; padding: 2px; width: 55mm; font-size: 6pt;">【個人情報の取扱いについて】<br>ご記入頂いた個人情報は、安衛法に基づく弊社業務に必要な資料の作成以外には使用致しません。</div>
                        <div style="text-align: center; flex-grow: 1;">

                            <div style="font-size: 8pt; margin-bottom: 2mm;">2026.7</div>
            <div style="width: 24mm; height: 30mm; border: 1px solid #000; position: relative; overflow: hidden; background: #fff;">
                ${photoSrc ? `<img src="${photoSrc}" style="width:100%; height:100%; object-fit:cover;">` : '写真なし'}
            </div>
                        </div>
                    </div>

                    <!-- チェックリスト1 -->
                    <div style="border: 1px solid #000; border-bottom: none; display: inline-block; padding: 2px 5px; font-weight: bold; font-size: 8pt;">チェックリスト１【注意事項】</div>
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 5mm; border: 1px solid #000; font-size: 8pt;">
                        <tr>
                            <td style="padding: 3px; border: 1px solid #000;">・黒のボールペンで太枠のみ、記入して下さい。 ・誤記入は二重線で訂正印。修正液厳禁。 ・虚偽申請は無効。</td>

                        <tr>
                            <td rowspan="2" style="width: 15mm; background: #eee; text-align: center; font-weight: bold; border: 1px solid #000;">氏名</td>
                            <td colspan="2" style="height: 15mm; border: 1px solid #000; padding: 5px;">
                                <span style="font-size: 7pt;">フリガナ：${r.userKana || ''}</span><br>
                                <span style="font-size: 16pt; font-weight: bold; margin-left: 5mm;">${r.userName}</span>
                            </td>
                            <td style="width: 50mm; border: 1px solid #000; font-size: 7pt; padding: 5px;">
                                助成金利用： □ 有 ・ □ 無<br>
                                記入日： R ${applyYear}年 ${today.getMonth()+1}月 ${today.getDate()}日
                            </td>
                        </tr>
                        <tr>
                            <td style="width: 45mm; border: 1px solid #000;">生年月日： S・H　　年　月　日</td>
                            <td colspan="2" style="border: 1px solid #000;">受講日： R 　年　月　日 ～ R 　年　月　日</td>
                        </tr>
                        <tr>
                            <td style="background: #eee; text-align: center; font-weight: bold; border: 1px solid #000;">住所</td>
                            <td colspan="3" style="height: 18mm; border: 1px solid #000; padding: 5px;">〒 ${r.zip || ''}<br>${r.address || ''}<br>電話：${r.phone || ''}</td>
                        </tr>
                        <tr>
                            <td style="background: #eee; text-align: center; font-weight: bold; border: 1px solid #000;">勤務先</td>
                            <td colspan="3" style="height: 18mm; border: 1px solid #000; padding: 5px;">会社名：${r.company || ''}<br>所在地：${r.compAddress || ''}<br>電話：${r.compPhone || ''} 　FAX：</td>
                        </tr>
                    </table>

                    <!-- チェックリスト3・振込先 -->
                    <div style="border: 1px solid #000; border-bottom: none; display: inline-block; padding: 2px 5px; font-weight: bold; font-size: 8pt; margin-top: 5mm;">チェックリスト３【講習料】</div>
                    <div style="border: 2px solid #000; display: flex; padding: 10px; font-size: 9pt;">
                        <div style="flex: 1;">受講料 <span style="font-size: 18pt; font-weight: bold;">¥25,000-</span><br>(税込・テキスト代込)</div>
                        <div style="flex: 1.5; border: 1px solid #000; border-radius: 10px; padding: 5px;">振込先：山口銀行 長府支店（普通） 5076778<br>口座名：株式会社 コプロス</div>
                    </div>

                    <!-- 弊社記入欄 -->
                    <table style="width: 100%; border-collapse: collapse; border: 2px solid #000; margin-top: 10mm; text-align: center; font-size: 8pt;">
                        <tr style="background: #eee;">
                            <td style="width: 30%; border: 1px solid #000;">弊社記入欄</td>
                            <td style="width: 40%; border: 1px solid #000;">当日の本人確認</td>

                        </tr>
                        <tr style="height: 15mm;">
                            <td style="border: 1px solid #000;">□ 銀行振込<br>入金日： 　/ 　</td>
                            <td style="border: 1px solid #000; font-size: 7pt;">□ 免許証 □ 保険証 □ 住基 □ 他</td>
                            <td style="border: 1px solid #000;"></td>

                    </table>
                </div>`;
        };

        window.printReservation = (id) => {
            const r = reservations.find(item => item.id === id);
            const printWindow = window.open('', '_blank');
            const content = window.generatePrintHTML(r);
            const html = `
                <html>
                <head>
                    <title>受講申込書_${r.userName}</title>
                    <style>
                        @page { size: A4; margin: 0; }
                        body { margin: 0; padding: 10mm; background: #fff; }
                        @media print { .no-print { display: none; } }
                    </style>
                </head>
                <body onload="window.print()">
                    <div class="no-print" style="background:#f8f9fa; padding:10px; text-align:right; border-bottom:1px solid #ddd;">
                        <button onclick="window.print()" style="padding:5px 15px; cursor:pointer;">印刷を実行する</button>
                    </div>
                    ${content}
                </body>
                </html>
            `;
            printWindow.document.write(html);
            printWindow.document.close();
        };

         // --- 和暦変換関数 ---
        window.toJpDate = (dateStr, prefix = "") => {
            if (!dateStr) return "";
            const date = new Date(dateStr);
            if (isNaN(date)) return dateStr;
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            let gengo = ""; let jpYear = 0;
            if (year >= 2019) { gengo = "R"; jpYear = year - 2018; }
            else if (year >= 1989) { gengo = "H"; jpYear = year - 1988; }
            else if (year >= 1926) { gengo = "S"; jpYear = year - 1925; }
            const yStr = jpYear === 1 ? "元" : jpYear;
            return `${prefix}${gengo}${yStr}年${month}月${day}日`;
        };

   
        let cropData = { x: 0, y: 0, zoom: 1, isDragging: false, startX: 0, startY: 0 };

        window.openCropper = (id) => {
            currentEditingId = id;
            const target = document.getElementById('target-photo-' + id);
            const img = document.getElementById('crop-v-image');
            const zoom = document.getElementById('crop-v-zoom');
            if (!target || !img) return;

            img.src = target.src;
            cropData.x = 0; cropData.y = 0; cropData.zoom = 1;
            zoom.value = 1;
            img.style.transform = `translate(0px, 0px) scale(1)`;
            document.getElementById('crop-modal').classList.add('active');
        };

        const cropImg = document.getElementById('crop-v-image');
        const cropArea = document.getElementById('crop-v-area');

        // ドラッグ移動処理
        cropArea.onmousedown = (e) => { 
            cropData.isDragging = true; 
            cropData.startX = e.clientX - cropData.x; 
            cropData.startY = e.clientY - cropData.y; 
        };
        window.onmousemove = (e) => {
            if (!cropData.isDragging) return;
            cropData.x = e.clientX - cropData.startX;
            cropData.y = e.clientY - cropData.startY;
            cropImg.style.transform = `translate(${cropData.x}px, ${cropData.y}px) scale(${cropData.zoom})`;
        };
        window.onmouseup = () => { cropData.isDragging = false; };

        // ズーム処理
        document.getElementById('crop-v-zoom').oninput = (e) => {
            cropData.zoom = e.target.value;
            cropImg.style.transform = `translate(${cropData.x}px, ${cropData.y}px) scale(${cropData.zoom})`;
        };

        // 切り抜き実行（Canvas使用）
        document.getElementById('btn-crop-v-save').onclick = async () => {
            const canvas = document.createElement('canvas');
            canvas.width = 240; canvas.height = 300; // 30mm x 24mm比率
            const ctx = canvas.getContext('2d');
            
            // 描画倍率の計算
            const ratio = 240 / 300; 
            const drawWidth = cropImg.naturalWidth * cropData.zoom * (240 / 300);
            const drawHeight = cropImg.naturalHeight * cropData.zoom * (240 / 300);

            // Canvasに今の見え方を描画
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, 240, 300);
            ctx.drawImage(cropImg, 
                cropData.x * (240 / 300), cropData.y * (240 / 300), 
                cropImg.naturalWidth * cropData.zoom * (240 / 300), 
                cropImg.naturalHeight * cropData.zoom * (240 / 300)
            );

            const croppedBase64 = canvas.toDataURL('image/jpeg', 0.8);
            try {
                await updateDoc(doc(db, "reservations", currentEditingId), { userPhotoBase64: croppedBase64 });
                alert("写真を保存しました！");
                document.getElementById('crop-modal').classList.remove('active');
                window.closeModal();
            } catch (e) { alert("保存失敗: " + e.message); }
        };

        // --- ExcelJS出力機能 ---
        window.downloadExcel = async (id) => {
            const r = reservations.find(item => item.id === id);
            if (!r) return;
            
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "生成中...";

            try {
                const response = await fetch('tamakake.xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(arrayBuffer);
                const sheet = workbook.getWorksheet(1);

                // 基本情報入力 (リストに基づき)
                sheet.getCell('E19').value = r.userKana;
                sheet.getCell('E22').value = r.userName;
                sheet.getCell('E28').value = window.toJpDate(r.birthDate);
                sheet.getCell('Q22').value = window.toJpDate(new Date());
                
                // 受講日 (開始〜終了)
                const cDate = r.courseDate || "";
                const dates = cDate.split('～');
                const dateRange = dates.length > 1 
                    ? `${window.toJpDate(dates[0].trim())}～${window.toJpDate(dates[1].trim())}`
                    : window.toJpDate(cDate);
                sheet.getCell('Q26').value = dateRange;

                sheet.getCell('F30').value = r.zip;
                sheet.getCell('F32').value = r.address;
                sheet.getCell('G35').value = r.phone;
                sheet.getCell('F37').value = r.compZip;
                sheet.getCell('P37').value = r.company;
                sheet.getCell('F40').value = r.compAddress;
                sheet.getCell('G43').value = r.compPhone;

                // 助成金 / 領収書 (判定)
                if (r.subsidy === "利用する") sheet.getCell('Z19').value = "〇";
                if (r.receiptName === "不要") sheet.getCell('G62').value = "✓";
                else {
                    sheet.getCell('L62').value = "✓";
                    if (r.receiptName === "会社名") sheet.getCell('T62').value = "✓";
                    else sheet.getCell('X62').value = r.receiptName;
                }

                // 写真挿入 (X4基準, 24mm x 30mm)
                const photoSrc = r.userPhotoBase64 || (r.photos && typeof r.photos === 'object' ? r.photos.user : (typeof r.photos === 'string' ? r.photos : null));
                if (photoSrc) {
                    const imageId = workbook.addImage({ base64: photoSrc, extension: 'jpeg' });
                    sheet.addImage(imageId, {
                        tl: { col: 23, row: 3 }, // X4 (0始まりなのでX=23, 4行目=3)
                        ext: { width: 91, height: 113 } // 約24mm x 30mm
                    });
                }

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `受講申込書_${r.userName}.xlsx`;
                a.click();
            } catch (e) {
                console.error(e);
                alert("Excel生成エラー: " + e.message);
            } finally {
                btn.innerText = originalText;
            }
        };       
    </script>
