<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC 管理画面 | スケジュール管理</title>
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- ★共通パーツの読み込み -->
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>

    <style>
        /* スケジュール管理専用スタイル */
        .admin-table { width: 100%; border-collapse: collapse; text-align: left; }
        .admin-table th { padding: 20px; font-weight: 900; color: #00a2ff; font-size: 0.65rem; text-transform: uppercase; background: rgba(56, 189, 248, 0.05); border-bottom: 1px solid rgba(56, 189, 248, 0.2); }
        .admin-table td { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.02); font-weight: 700; font-size: 0.85rem; }
        
        .btn-add { background: linear-gradient(135deg, #00a2ff 0%, #0081cc 100%); color: white; padding: 12px 30px; border-radius: 50px; font-[900]; border: none; cursor: pointer; transition: 0.3s; font-style: italic; box-shadow: 0 10px 20px rgba(0, 162, 255, 0.2); }
        .btn-add:hover { transform: scale(1.05); shadow: 0 15px 30px rgba(0, 162, 255, 0.4); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #0f172a; border: 1px solid #00a2ff; border-radius: 2.5rem; padding: 50px; width: 95%; max-width: 550px; box-shadow: 0 0 100px rgba(0, 162, 255, 0.1); }
        
        .input-field { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(56,189,248,0.2); border-radius: 12px; color: #fff; font-weight: bold; margin-bottom: 20px; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #00a2ff; background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <!-- サイドバーは common.js が自動生成 -->

    <div class="main-content">
        <div class="flex justify-between items-start mb-12">
            <div>
                <h1 class="admin-page-title">Schedule</h1>
                <p class="admin-page-subtitle">講習日程・定員のリアルタイム管理</p>
            </div>
            <button class="btn-add" onclick="openModal()"><i class="fas fa-plus mr-2"></i> 新規講習を追加</button>
        </div>
        
        <div class="admin-card overflow-hidden !p-0">
            <table class="admin-table">
                <thead>
                    <tr><th>講習コース</th><th>開催月</th><th>日程（表示）</th><th>定員</th><th>申込</th><th>予約</th><th>空席</th><th>操作</th></tr>
                </thead>
                <tbody id="schedule-list" class="text-white"></tbody>
            </table>
        </div>
    </div>

    <!-- 編集・追加モーダル -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content text-left">
            <h2 class="text-3xl font-[900] text-sky-400 italic mb-8 uppercase tracking-tighter">Edit Schedule</h2>
            <form id="schedule-form" onsubmit="window.saveSchedule(event)">
                <label class="text-[10px] font-black text-slate-500 uppercase block mb-2 tracking-widest">講習種別</label>
                <select id="courseId" class="input-field" required onchange="window.autoSetCapacity(this.value)">
                    <option value="">選択してください</option>
                    <option value="玉掛け技能講習">玉掛け技能講習</option>
                    <option value="小型移動式クレーン">小型移動式クレーン</option>
                    <option value="フォークリフト（11H）">フォークリフト（11H）</option>
                    <option value="フォークリフト（31H）">フォークリフト（31H）</option>
                    <option value="フルハーネス特別教育">フルハーネス特別教育</option>
                    <option value="テールゲートリフター特別教育">テールゲートリフター特別教育</option>
                </select>

                <div class="grid grid-cols-2 gap-6">
                    <div><label class="text-[10px] font-black text-slate-500 block mb-2 uppercase tracking-widest">開催月</label><input type="number" id="month" class="input-field" placeholder="7" required></div>
                    <div><label class="text-[10px] font-black text-slate-500 block mb-2 uppercase tracking-widest">定員</label><input type="number" id="capacity" class="input-field" required></div>
                </div>

                <label class="text-[10px] font-black text-slate-500 block mb-2 uppercase tracking-widest">表示用日程（例: 7/15-7/17）</label>
                <input type="text" id="dayDisplay" class="input-field" placeholder="7/15-7/17" required>

                <div class="grid grid-cols-2 gap-6">
                    <div><label class="text-[10px] font-black text-slate-500 block mb-2 uppercase tracking-widest">開始日（数値）</label><input type="text" id="dayStart" class="input-field" placeholder="15" required></div>
                    <div><label class="text-[10px] font-black text-slate-500 block mb-2 uppercase tracking-widest">終了日（数値）</label><input type="number" id="dayEnd" class="input-field" placeholder="17"></div>
                </div>
                <div class="grid grid-cols-2 gap-6 mt-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 block mb-2 uppercase tracking-widest">現在の申込数</label>
                        <input type="number" id="fullApplied" class="input-field" placeholder="0" min="0">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-500 block mb-2 uppercase tracking-widest">現在の予約数</label>
                        <input type="number" id="reserved" class="input-field" placeholder="0" min="0">
                    </div>
                </div>
                <div class="flex gap-4 mt-6">
                    <button type="submit" class="flex-1 bg-sky-500 py-4 rounded-xl font-black uppercase shadow-lg shadow-sky-500/20 text-white hover:bg-sky-400 transition-all">保存して公開</button>
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 py-4 rounded-xl font-black uppercase text-slate-400 hover:text-white transition-all">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw", 
            authDomain: "stc-hp.firebaseapp.com", 
            projectId: "stc-hp", 
            storageBucket: "stc-hp.firebasestorage.app", 
            messagingSenderId: "795332931918", 
            appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let schedules = [];
        let editingId = null;

        window.autoSetCapacity = (name) => {
            const capEl = document.getElementById('capacity');
            if (name.includes("クレーン")) capEl.value = 6;
            else if (name.includes("玉掛け")) capEl.value = 8;
            else capEl.value = 10;
        };

        signInAnonymously(auth).then(() => {
            onSnapshot(collection(db, "schedules"), (snap) => {
                schedules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable();
            });
        });

        function renderTable() {
            const tbody = document.getElementById('schedule-list');
            tbody.innerHTML = schedules.sort((a,b) => a.month - b.month).map(item => {
                const moshikomi = Number(item.fullApplied || 0);
                const yoyaku = Number(item.reserved || 0);
                const cap = Number(item.capacity || 10);
                const avail = cap - (moshikomi + yoyaku);
                
                return `<tr class="hover:bg-white/5 transition-colors">
                    <td class="text-[#00a2ff] font-black italic">${item.courseName}</td>
                    <td class="font-en">${item.month}月</td>
                    <td class="font-en">${item.date}</td>
                    <td class="text-slate-400 font-en">${cap}</td>
                    <td class="text-emerald-400 font-en">${moshikomi}</td>
                    <td class="text-amber-400 font-en">${yoyaku}</td>
                    <td><span class="px-4 py-1 rounded-full font-en ${avail <= 0 ? 'bg-rose-500/20 text-rose-500' : 'bg-emerald-500/20 text-emerald-500'}">${avail}</span></td>
                    <td class="space-x-2">
                        <button class="bg-sky-500/10 text-sky-400 px-4 py-1.5 rounded-lg text-[10px] font-black hover:bg-sky-500 hover:text-white transition" onclick="window.editSchedule('${item.id}')">編集</button>
                        <button class="bg-rose-500/10 text-rose-500 px-4 py-1.5 rounded-lg text-[10px] font-black hover:bg-rose-500 hover:text-white transition" onclick="window.deleteSchedule('${item.id}')">削除</button>
                    </td>
                </tr>`;
            }).join('');
        }

        window.openModal = () => { editingId = null; document.getElementById('schedule-form').reset(); document.getElementById('modal-overlay').classList.add('active'); };
        window.closeModal = () => { document.getElementById('modal-overlay').classList.remove('active'); };

        window.editSchedule = (id) => {
            const item = schedules.find(s => s.id === id);
            editingId = id;
            document.getElementById('courseId').value = item.courseName;
            document.getElementById('month').value = item.month;
            document.getElementById('dayStart').value = item.dayStart;
            document.getElementById('dayEnd').value = item.dayEnd;
            document.getElementById('dayDisplay').value = item.date;
            document.getElementById('capacity').value = item.capacity;
            // 以下の2行を追加して数値をフォームに表示させます
            document.getElementById('fullApplied').value = item.fullApplied || 0;
            document.getElementById('reserved').value = item.reserved || 0;
            document.getElementById('modal-overlay').classList.add('active');
        };

          window.saveSchedule = async (e) => {
            e.preventDefault();
            const data = {
                courseName: document.getElementById('courseId').value,
                month: parseInt(document.getElementById('month').value),
                dayStart: document.getElementById('dayStart').value,
                dayEnd: parseInt(document.getElementById('dayEnd').value) || 0,
                date: document.getElementById('dayDisplay').value,
                capacity: parseInt(document.getElementById('capacity').value),
                // 手動入力された数値をFirestoreに送る
                fullApplied: parseInt(document.getElementById('fullApplied').value) || 0,
                reserved: parseInt(document.getElementById('reserved').value) || 0,
                status: 'ok'
            };
            if (editingId) await updateDoc(doc(db, "schedules", editingId), data);
            else await addDoc(collection(db, "schedules"), data);
            closeModal();
        };

        window.deleteSchedule = async (id) => { if(confirm("本当にこの日程を削除しますか？")) await deleteDoc(doc(db, "schedules", id)); };
    </script>
</body>
</html>
