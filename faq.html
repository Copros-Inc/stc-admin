<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC 管理画面 | FAQ管理</title>
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- ★共通パーツの読み込み -->
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>

    <style>
        /* FAQ管理専用スタイル */
        .faq-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: 40px; margin-bottom: 25px; transition: 0.3s; position: relative; overflow: hidden; }
        .faq-card:hover { border-color: #00a2ff; background: rgba(0, 162, 255, 0.02); }
        .faq-order { position: absolute; top: 0; left: 0; background: #00a2ff; color: #001a33; font-family: 'Montserrat'; font-[900]; padding: 5px 15px; border-bottom-right-radius: 15px; font-size: 0.75rem; }

        .btn-add { background: linear-gradient(135deg, #00a2ff 0%, #0081cc 100%); color: white; padding: 12px 35px; border-radius: 50px; font-[900]; border: none; cursor: pointer; transition: 0.3s; font-style: italic; box-shadow: 0 10px 20px rgba(0, 162, 255, 0.2); }
        .btn-add:hover { transform: scale(1.05); shadow: 0 15px 30px rgba(0, 162, 255, 0.4); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #0f172a; border: 1px solid #00a2ff; border-radius: 2.5rem; padding: 50px; width: 95%; max-width: 650px; }
        
        .input-field { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(56,189,248,0.2); border-radius: 12px; color: #fff; font-weight: bold; margin-bottom: 25px; outline: none; }
        .input-field:focus { border-color: #00a2ff; background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <!-- サイドバーは common.js が自動生成 -->

    <div class="main-content">
        <div class="flex justify-between items-start mb-12">
            <div>
                <h1 class="admin-page-title">FAQ Manager</h1>
                <p class="admin-page-subtitle">よくある質問の追加・編集・並び替え</p>
            </div>
            <button class="btn-add" onclick="window.openFaqModal()"><i class="fas fa-plus mr-2"></i> 新規質問を追加</button>
        </div>

        <div id="faq-list" class="space-y-6 text-left">
            <p class="text-center text-slate-600 italic py-20 animate-pulse">データを読み込み中...</p>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content text-left">
            <h2 id="modal-title" class="text-3xl font-[900] text-sky-400 italic mb-10 uppercase tracking-tighter">Edit FAQ</h2>
            <form id="faq-form">
                <label class="text-[10px] font-black text-slate-500 uppercase block mb-2 tracking-widest">質問内容 / Question</label>
                <input type="text" id="faqQuestion" class="input-field" placeholder="例：未経験でも受講可能ですか？" required>
                
                <label class="text-[10px] font-black text-slate-500 uppercase block mb-2 tracking-widest">回答内容 / Answer</label>
                <textarea id="faqAnswer" class="input-field" rows="5" placeholder="例：はい、初心者の方でもベテラン講師が丁寧に指導いたします。" required></textarea>
                
                <label class="text-[10px] font-black text-slate-500 uppercase block mb-2 tracking-widest">表示順 / Order (数字が小さいほど上に表示)</label>
                <input type="number" id="faqOrder" class="input-field" value="10" required>
                
                <div class="flex gap-4 mt-4">
                    <button type="submit" class="flex-1 bg-sky-500 text-white py-4 rounded-xl font-[900] italic shadow-lg hover:bg-sky-400 transition-all uppercase">保存する / SAVE</button>
                    <button type="button" onclick="window.closeFaqModal()" class="flex-1 bg-slate-800 text-slate-400 py-4 rounded-xl font-[900] italic hover:text-white transition-all uppercase">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw", 
            authDomain: "stc-hp.firebaseapp.com", 
            projectId: "stc-hp", 
            storageBucket: "stc-hp.firebasestorage.app", 
            messagingSenderId: "795332931918", 
            appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let faqs = [];
        let editingId = null;

        signInAnonymously(auth).then(() => {
            onSnapshot(query(collection(db, "faq"), orderBy("order", "asc")), (snap) => {
                faqs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const listEl = document.getElementById('faq-list');
                listEl.innerHTML = faqs.map(f => `
                    <div class="faq-card reveal active">
                        <div class="faq-order">SORT: ${f.order}</div>
                        <div class="md:pl-6">
                            <h3 class="text-[#00a2ff] font-[900] text-2xl italic mb-4 leading-tight">Q. ${f.question}</h3>
                            <p class="text-slate-300 font-bold text-lg leading-loose italic">A. ${f.answer}</p>
                            <div class="mt-8 pt-8 border-t border-white/5 flex justify-end gap-4">
                                <button class="bg-sky-500/10 text-sky-400 px-6 py-2 rounded-lg text-[11px] font-black uppercase hover:bg-sky-500 hover:text-white transition" onclick="window.openFaqModal('${f.id}')">Edit</button>
                                <button class="bg-rose-500/10 text-rose-500 px-6 py-2 rounded-lg text-[11px] font-black uppercase hover:bg-rose-500 hover:text-white transition" onclick="window.deleteFaq('${f.id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `).join('') || '<p class="text-center text-slate-600 py-10">質問が登録されていません</p>';
            });
        });

        window.openFaqModal = (id = null) => {
            editingId = id;
            const form = document.getElementById('faq-form');
            form.reset();
            document.getElementById('modal-title').innerText = id ? 'Edit FAQ' : 'New FAQ';
            if (id) {
                const f = faqs.find(item => item.id === id);
                document.getElementById('faqQuestion').value = f.question;
                document.getElementById('faqAnswer').value = f.answer;
                document.getElementById('faqOrder').value = f.order;
            }
            document.getElementById('modal-overlay').classList.add('active');
        };

        window.closeFaqModal = () => document.getElementById('modal-overlay').classList.remove('active');

        document.getElementById('faq-form').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                question: document.getElementById('faqQuestion').value,
                answer: document.getElementById('faqAnswer').value,
                order: parseInt(document.getElementById('faqOrder').value),
                updatedAt: serverTimestamp()
            };
            try {
                if (editingId) await updateDoc(doc(db, "faq", editingId), data);
                else await addDoc(collection(db, "faq"), { ...data, createdAt: serverTimestamp() });
                window.closeFaqModal();
            } catch (err) { alert("エラー: " + err.message); }
        };

        window.deleteFaq = async (id) => { if(confirm("この質問を完全に削除しますか？")) await deleteDoc(doc(db, "faq", id)); };
    </script>
</body>
</html>
