<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC 管理画面 | お知らせ管理</title>
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- ★共通パーツの読み込み -->
    <link rel="stylesheet" href="css/common.css">
    <script src="js/common.js"></script>

    <style>
        /* お知らせ管理専用スタイル */
        .input-field { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(56,189,248,0.2); border-radius: 12px; color: #fff; font-weight: bold; margin-bottom: 20px; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #00a2ff; background: rgba(56,189,248,0.05); }
        
        .news-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 25px; margin-bottom: 15px; display: flex; align-items: center; gap: 25px; transition: 0.3s; }
        .news-item:hover { border-color: #00a2ff; background: rgba(0, 162, 255, 0.02); }
        .news-date { font-family: 'Montserrat'; font-size: 0.9rem; color: #64748b; font-weight: 900; min-width: 100px; }
        .news-content { flex-grow: 1; font-weight: 700; color: #f1f5f9; font-size: 1rem; text-align: left; }
        .tag-important { background: #ef4444; color: white; font-size: 10px; padding: 3px 10px; border-radius: 6px; font-[900]; margin-right: 12px; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); text-transform: uppercase; }

        .btn-post { background: linear-gradient(135deg, #00a2ff 0%, #0081cc 100%); color: white; padding: 15px 45px; border-radius: 50px; font-[900]; border: none; cursor: pointer; transition: 0.3s; font-style: italic; box-shadow: 0 10px 20px rgba(0, 162, 255, 0.2); }
        .btn-post:hover { transform: scale(1.02); shadow: 0 15px 30px rgba(0, 162, 255, 0.4); }
    </style>
</head>
<body>
    <!-- サイドバーは common.js が自動生成 -->

    <div class="main-content text-left">
        <h1 class="admin-page-title">News Manager</h1>
        <p class="admin-page-subtitle">HPトップ掲示板の緊急告知・お知らせ管理</p>

        <!-- 新規投稿フォーム -->
        <div class="admin-card mb-12">
            <form id="news-form">
                <label class="text-[10px] font-black text-slate-500 uppercase block mb-3 tracking-widest italic">News Content</label>
                <textarea id="newsContent" class="input-field" rows="3" placeholder="例：【重要】本日の講習は予定通り実施いたします。" required></textarea>
                
                <div class="flex items-center gap-6 mb-10">
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="isImportant" class="w-6 h-6 accent-red-500">
                        <span class="text-sm font-black italic text-rose-400 uppercase tracking-widest group-hover:text-rose-300 transition">重要フラグを有効にする</span>
                    </label>
                </div>
                
                <button type="submit" class="btn-post uppercase tracking-widest">
                    <i class="fas fa-paper-plane mr-2"></i> HPに投稿する / POST
                </button>
            </form>
        </div>

        <!-- 投稿済みリスト -->
        <div class="flex items-center gap-3 mb-8 border-l-4 border-[#00a2ff] pl-4">
            <h2 class="text-xl font-[900] italic text-white uppercase">History</h2>
            <span class="text-slate-600 text-xs font-bold uppercase tracking-widest">過去の投稿一覧</span>
        </div>
        <div id="news-list" class="space-y-4">
            <p class="text-center text-slate-600 italic py-10 animate-pulse">データを読み込み中...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw", 
            authDomain: "stc-hp.firebaseapp.com", 
            projectId: "stc-hp", 
            storageBucket: "stc-hp.firebasestorage.app", 
            messagingSenderId: "795332931918", 
            appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        signInAnonymously(auth).then(() => {
            // お知らせ一覧の監視
            onSnapshot(query(collection(db, "news"), orderBy("createdAt", "desc")), (snap) => {
                const listEl = document.getElementById('news-list');
                listEl.innerHTML = snap.docs.map(d => {
                    const data = d.data();
                    const date = data.createdAt?.toDate().toLocaleDateString('ja-JP', {year:'numeric', month:'2-digit', day:'2-digit'}) || '---';
                    return `
                    <div class="news-item reveal active">
                        <div class="news-date font-en">${date}</div>
                        <div class="news-content">
                            ${data.isImportant ? '<span class="tag-important">重要</span>' : ''}
                            ${data.content}
                        </div>
                        <button class="bg-rose-500/10 text-rose-500 px-4 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-rose-500 hover:text-white transition" onclick="window.deleteNews('${d.id}')">Delete</button>
                    </div>`;
                }).join('') || '<p class="text-center text-slate-600 italic py-10">投稿されたお知らせはありません</p>';
            });
        });

        // 投稿処理
        document.getElementById('news-form').onsubmit = async (e) => {
            e.preventDefault();
            const content = document.getElementById('newsContent').value;
            const isImportant = document.getElementById('isImportant').checked;
            try {
                await addDoc(collection(db, "news"), { content: content, isImportant: isImportant, createdAt: serverTimestamp() });
                document.getElementById('news-form').reset();
                alert("HPに投稿しました！");
            } catch (err) { alert("投稿エラー: " + err.message); }
        };

        // 削除処理
        window.deleteNews = async (id) => { if(confirm("このお知らせを完全に削除しますか？")) await deleteDoc(doc(db, "news", id)); };
    </script>
</body>
</html>
